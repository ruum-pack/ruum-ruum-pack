# Allowlist for test fixtures that intentionally contain fake secrets for scanner testing
# These are not real secrets and are used to verify that scan-secrets.mjs correctly detects them.
# GitHub push protection should ignore these paths.
paths-ignore:
  - 'tests/fixtures/test-secret-positive/**'
  - 'tests/security/scan-secrets.test.mjs'
  - 'tests/fixtures/**'

