name: Accessibility Audit

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

jobs:
  eslint-a11y:
    name: ESLint Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint with accessibility rules
        run: pnpm --filter @ruum/app-conductor run lint:a11y

  axe-core:
    name: Axe Core Audit
    runs-on: ubuntu-latest
    needs: eslint-a11y
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @ruum/app-conductor run build

      - name: Start server
        run: |
          pnpm --filter @ruum/app-conductor run dev &
          sleep 30
          echo "Server started"

      - name: Run Axe CLI audit
        run: |
          pnpm --filter @ruum/app-conductor run test:axe
          # Verificar que no haya errores críticos
          if [ -f results/axe-report.json ]; then
            echo "Axe report generated"
            cat results/axe-report.json
          else
            echo "No axe report found"
            exit 1
          fi

  playwright-a11y:
    name: Playwright Accessibility Tests
    runs-on: ubuntu-latest
    needs: eslint-a11y
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_E2E_CONDUCTOR_EMAIL: ${{ secrets.E2E_CONDUCTOR_EMAIL }}
      PLAYWRIGHT_E2E_CONDUCTOR_PASSWORD: ${{ secrets.E2E_CONDUCTOR_PASSWORD }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_PUBLIC_APP_VERSION: ci
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_RUUM_AMBIENTE: staging
      CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_RUUM_SOPORTE_TELEFONO: "5500000000"
      NEXT_PUBLIC_RUUM_SOPORTE_CORREO: soporte-conductores-pruebas@example.test
      NEXT_PUBLIC_RUUM_EMERGENCIA_TELEFONO: "911"
      PLAYWRIGHT_DISABLE_AUTH_ARTIFACTS: "1"
      PLAYWRIGHT_A11Y_PROJECT: chromium
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @ruum/app-conductor exec playwright install --with-deps chromium firefox webkit

      - name: Build application
        run: pnpm --filter @ruum/app-conductor run build

      - name: Start server
        run: |
          pnpm --filter @ruum/app-conductor run dev &
          sleep 30
          echo "Server started"

      - name: Run Playwright accessibility tests
        run: pnpm --filter @ruum/app-conductor run test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  lighthouse:
    name: Lighthouse Accessibility Audit
    runs-on: ubuntu-latest
    needs: eslint-a11y
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lighthouse CI
        run: pnpm --filter @ruum/app-conductor add -D @lhci/cli

      - name: Build application
        run: pnpm --filter @ruum/app-conductor run build

      - name: Start server
        run: |
          pnpm --filter @ruum/app-conductor run dev &
          sleep 30
          echo "Server started"

      - name: Run Lighthouse CI
        run: |
          pnpm --filter @ruum/app-conductor run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          if-no-files-found: warn
          path: |
            apps/app-conductor/.lighthouse-ci/
            apps/app-conductor/.lighthouseci/

  storybook-a11y:
    name: Storybook Accessibility Addon
    runs-on: ubuntu-latest
    needs: eslint-a11y
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @ruum/app-conductor run storybook:build

      - name: Check Storybook accessibility
        run: |
          # Verificar que Storybook se construya correctamente
          if [ -d "storybook-static" ]; then
            echo "Storybook built successfully with a11y addon"
          else
            echo "Storybook build failed"
            exit 1
          fi

  summary:
    name: Accessibility Audit Summary
    runs-on: ubuntu-latest
    needs: [eslint-a11y, axe-core, playwright-a11y, lighthouse, storybook-a11y]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Accessibility Audit Summary"
          echo ""
          echo "### Results:"
          echo "- ESLint: ${{ needs.eslint-a11y.result }}"
          echo "- Axe Core: ${{ needs.axe-core.result }}"
          echo "- Playwright: ${{ needs.playwright-a11y.result }}"
          echo "- Lighthouse: ${{ needs.lighthouse.result }}"
          echo "- Storybook: ${{ needs.storybook-a11y.result }}"
          echo ""
          
if [ "${{ needs.eslint-a11y.result }}" == "success" ] && \
   ([ "${{ needs.axe-core.result }}" == "success" ] || [ "${{ needs.axe-core.result }}" == "skipped" ]) && \
   ([ "${{ needs.playwright-a11y.result }}" == "success" ] || [ "${{ needs.playwright-a11y.result }}" == "skipped" ]) && \
   ([ "${{ needs.lighthouse.result }}" == "success" ] || [ "${{ needs.lighthouse.result }}" == "skipped" ]) && \
   ([ "${{ needs.storybook-a11y.result }}" == "success" ] || [ "${{ needs.storybook-a11y.result }}" == "skipped" ]); then
  echo "✅ All accessibility checks passed!"
  exit 0
else
  echo "❌ Some accessibility checks failed"
  exit 1
fi
