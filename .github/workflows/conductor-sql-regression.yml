name: Conductor SQL regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/app-conductor/**"
      - "packages/api/src/services/traslados.ts"
      - "packages/shared/src/states/**"
      - "supabase/migrations/**"
      - "supabase/test/rt35*"
      - "supabase/test/rt36*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/conductor-sql-regression.yml"
  push:
    branches:
      - main
    paths:
      - "apps/app-conductor/**"
      - "packages/api/src/services/traslados.ts"
      - "packages/shared/src/states/**"
      - "supabase/migrations/**"
      - "supabase/test/rt35*"
      - "supabase/test/rt36*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/conductor-sql-regression.yml"

concurrency:
  group: conductor-sql-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conductor-sql-regression:
    name: SQL conductor operation guards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: v2.117.0

      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset local database
        run: pnpm db:reset

      - name: Run conductor SQL regression tests
        run: >
          supabase test db
          supabase/test/rt35_conductor_no_aprobado_no_opera.test.sql
          supabase/test/rt36_conductor_confirma_llegada_destino_atomica.test.sql

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
