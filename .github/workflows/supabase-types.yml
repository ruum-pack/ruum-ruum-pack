name: Supabase types

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - "packages/shared/src/types/supabase.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/supabase-types.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "packages/shared/src/types/supabase.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/supabase-types.yml"

concurrency:
  group: supabase-types-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-generated-types:
    name: Check generated Supabase types
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: v2.117.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset local database
        run: pnpm db:reset

      - name: Regenerate Supabase types
        run: pnpm db:types

      - name: Check generated types are committed
        run: git diff --exit-code -- packages/shared/src/types/supabase.ts

      - name: Check schema and Storage policy drift
        run: pnpm check:supabase-drift

      - name: Check grants to anon
        run: pnpm check:supabase-security

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

  linked-drift:
    name: Check linked Supabase drift
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project and fail on live drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DRIFT_MODE: linked
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          node scripts/check-supabase-drift.mjs
