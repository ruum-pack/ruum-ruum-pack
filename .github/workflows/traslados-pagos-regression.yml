name: Traslados y pagos regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/test/b1_usuario_crea_traslado.test.sql"
      - "supabase/test/b2_piso_techo_precio.test.sql"
      - "supabase/functions/crear-payment-intent/**"
      - "supabase/functions/stripe-webhook/**"
      - "apps/app-usuario/src/app/traslados/**"
      - "packages/api/src/services/traslados.ts"
      - "packages/api/src/services/tarifas.ts"
      - "packages/shared/src/types/supabase.ts"
      - "packages/shared/src/types/traslado.ts"
      - "packages/shared/src/types/pago.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/traslados-pagos-regression.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/test/b1_usuario_crea_traslado.test.sql"
      - "supabase/test/b2_piso_techo_precio.test.sql"
      - "supabase/functions/crear-payment-intent/**"
      - "supabase/functions/stripe-webhook/**"
      - "apps/app-usuario/src/app/traslados/**"
      - "packages/api/src/services/traslados.ts"
      - "packages/api/src/services/tarifas.ts"
      - "packages/shared/src/types/supabase.ts"
      - "packages/shared/src/types/traslado.ts"
      - "packages/shared/src/types/pago.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/traslados-pagos-regression.yml"

concurrency:
  group: traslados-pagos-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sql-money-flow:
    name: SQL traslado money flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: v2.117.0

      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset local database
        run: pnpm db:reset

      - name: Run traslado money SQL tests
        run: supabase test db supabase/test/b1_usuario_crea_traslado.test.sql supabase/test/b2_piso_techo_precio.test.sql

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

  edge-money-flow:
    name: Edge payment money flow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run payment Edge Function tests
        run: deno test supabase/functions/crear-payment-intent/logica.test.ts supabase/functions/stripe-webhook/logica.test.ts
