name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_PUBLIC_PANEL_ADMIN_DEMO: "false"
      NEXT_PUBLIC_APP_VERSION: 0.0.0-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_RUUM_AMBIENTE: staging
      CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_RUUM_SOPORTE_TELEFONO: "5500000000"
      NEXT_PUBLIC_RUUM_SOPORTE_CORREO: soporte-conductores-pruebas@example.test
      NEXT_PUBLIC_RUUM_EMERGENCIA_TELEFONO: "911"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Get pnpm store directory
        id: get-pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.get-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify clean-install contract
        run: pnpm ci:clean

      - name: Validate production-like environment
        env:
          NODE_ENV: production
        run: pnpm --filter @ruum/panel-admin validate:env

      - name: Verify unified app version
        run: node scripts/verify-app-version.mjs

      - name: Run panel-admin security regression (p0)
        run: pnpm test:p0

      - name: Run Android close static regression
        run: |
          node apps/app-conductor/tests/android/sprint-close-p0-static.test.mjs
          node apps/app-conductor/tests/android/sprint-close-p1-static.test.mjs
          node apps/app-conductor/tests/android/sprint-close-fix-static.test.mjs
          node apps/app-conductor/tests/android/sprint-close-fix2-static.test.mjs

      - name: Scan secrets (P0 SEC-006 — bloqueante)
        run: pnpm scan:secrets

      - name: Security scanner regression tests (P0 SEC-006)
        run: pnpm test:security

      - name: Audit dependencias (report-only — baseline 57 vulns 2026-09-14, endurecer a bloqueante tras triage)
        continue-on-error: true
        run: pnpm audit:deps

      - name: Assert CSP (SEC-002 — bloqueante, sin unsafe-eval en prod)
        run: pnpm --filter @ruum/app-conductor assert:csp

      - name: Assert CSP app-usuario (SEC-002 — bloqueante)
        run: pnpm --filter @ruum/app-usuario assert:csp

      - name: Assert CSP panel-admin (SEC-002 — bloqueante)
        run: pnpm --filter @ruum/panel-admin assert:csp

      - name: Assert CSP strict staging (SEC-003 — 7d ventana, style-src sin unsafe-inline)
        env:
          CSP_STRICT_STYLES: "true"
          NEXT_PUBLIC_CSP_STRICT_STYLES: "true"
        run: pnpm --filter @ruum/app-conductor assert:csp

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Fronteras de acceso (Fase 6 — sin nuevos .from/.rpc en apps)
        run: pnpm check:fronteras

      - name: App conductor quality gate — typecheck (bloqueante)
        run: pnpm --filter @ruum/app-conductor typecheck

      - name: App conductor quality gate — lint (bloqueante, sin ignoreDuringBuilds)
        run: pnpm --filter @ruum/app-conductor lint

      - name: App usuario quality gate — lint (bloqueante, sin ignoreDuringBuilds)
        run: pnpm --filter @ruum/app-usuario lint

      - name: Panel admin quality gate — lint (bloqueante, sin ignoreDuringBuilds)
        run: pnpm --filter @ruum/panel-admin lint

      - name: Unit tests
        run: pnpm test:unit

      - name: App conductor tests
        run: pnpm --filter @ruum/app-conductor test

      - name: Panel admin unit tests
        run: pnpm --filter @ruum/panel-admin test

      - name: App conductor coverage (P0 gate — 30/30 bloqueante)
        run: pnpm --filter @ruum/app-conductor test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-conductor-coverage
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/app-conductor/coverage/

      - name: Build
        run: pnpm build

  app-conductor-critical-e2e:
    name: App conductor critical Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://ci.supabase.test' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'ci-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || 'ci-service-role' }}
      PLAYWRIGHT_E2E_CONDUCTOR_EMAIL: ${{ secrets.E2E_CONDUCTOR_EMAIL || 'test@example.test' }}
      PLAYWRIGHT_E2E_CONDUCTOR_PASSWORD: ${{ secrets.E2E_CONDUCTOR_PASSWORD || 'TestPass123!' }}
      PLAYWRIGHT_E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD || 'TestPass123!' }}
      PLAYWRIGHT_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://ci.supabase.test' }}
      PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || 'ci-service-role' }}
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_RUUM_AMBIENTE: staging
      CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_RUUM_SOPORTE_TELEFONO: "5500000000"
      NEXT_PUBLIC_RUUM_SOPORTE_CORREO: soporte-conductores-pruebas@example.test
      NEXT_PUBLIC_RUUM_EMERGENCIA_TELEFONO: "911"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.51.1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm --filter @ruum/app-conductor exec playwright install --with-deps chromium

      - name: Ensure dummy auth state for CI without real Supabase
        run: |
          mkdir -p apps/app-conductor/tests/.auth
          if [ ! -f apps/app-conductor/tests/.auth/conductor.json ] || [ "$(cat apps/app-conductor/tests/.auth/conductor.json | tr -d ' \n\r\t')" = "" ]; then
            echo '{"cookies":[],"origins":[]}' > apps/app-conductor/tests/.auth/conductor.json
          fi
          cat apps/app-conductor/tests/.auth/conductor.json | head -c 200; echo

      - name: Build app for E2E (production)
        run: pnpm --filter @ruum/app-conductor build

      - name: Start production server
        run: |
          pnpm --filter @ruum/app-conductor exec next start -p 3001 > /tmp/next-e2e.log 2>&1 &
          echo $! > /tmp/next-e2e.pid
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost:3001/onboarding > /dev/null 2>&1; then
              echo "Server ready after $i attempts"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: Servidor no respondiendo tras 60s"
              cat /tmp/next-e2e.log || true
              exit 1
            fi
            sleep 2
          done
          curl -fsSL http://localhost:3001/login | head -c 200; echo

      - name: Run critical conductor flows
        run: pnpm --filter @ruum/app-conductor exec playwright test tests/e2e/sprint-c5-critical-flows.spec.ts --project=chromium --workers=1

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/next-e2e.pid ]; then kill $(cat /tmp/next-e2e.pid) || true; fi
          sleep 2

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-conductor-critical-e2e
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/app-conductor/playwright-report/
            apps/app-conductor/test-results/
            /tmp/next-e2e.log
            !apps/app-conductor/tests/.auth/
            !**/.auth/**
            !**/*.zip

  signed-conductor-apk:
    name: Signed conductor APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUUM_REMOTE_URL: ${{ vars.RUUM_CONDUCTOR_REMOTE_URL_STAGING || 'https://www.concer.ruumruum-moviliax.online' }}
      RUUM_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/app-conductor/android/app/release.keystore
      RUUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RUUM_ANDROID_KEYSTORE_PASSWORD }}
      RUUM_ANDROID_KEY_ALIAS: ${{ secrets.RUUM_ANDROID_KEY_ALIAS }}
      RUUM_ANDROID_KEY_PASSWORD: ${{ secrets.RUUM_ANDROID_KEY_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://ci.supabase.test' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'ci-anon-key' }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_RUUM_AMBIENTE: staging
      CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_CSP_STRICT_STYLES: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # NOTE: migrado de v4 a v5 (v4 deprecado 2026-08, sin más updates)

      - name: Validate release secrets
        env:
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_B64: ${{ secrets.RUUM_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$FIREBASE_JSON_B64"
          test -n "$KEYSTORE_B64"
          test -n "$RUUM_ANDROID_KEYSTORE_PASSWORD"
          test -n "$RUUM_ANDROID_KEY_ALIAS"
          test -n "$RUUM_ANDROID_KEY_PASSWORD"
          test -n "$RUUM_REMOTE_URL"

      - name: Materialize Firebase and signing key
        env:
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_B64: ${{ secrets.RUUM_ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$FIREBASE_JSON_B64" | base64 --decode > apps/app-conductor/android/app/google-services.json
          echo "$KEYSTORE_B64" | base64 --decode > "$RUUM_ANDROID_KEYSTORE_PATH"
          jq -e '.project_info.project_id and ([.client[].client_info.android_client_info.package_name] | index("com.moviliax.ruumruum.conductor"))' apps/app-conductor/android/app/google-services.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build conductor web bundle
        run: pnpm --filter @ruum/app-conductor build

      - name: Sync Capacitor Android
        run: pnpm --filter @ruum/app-conductor exec cap sync android

      - name: Verify no service_role in Android source
        run: |
          ! grep -ri "service_role" apps/app-conductor/android/

      - name: Build signed release APK
        working-directory: apps/app-conductor/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK signature and hashes
        run: |
          APK=apps/app-conductor/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose --print-certs "$APK" | tee apps/app-conductor/android/app/build/outputs/apk/release/signature.txt
          sha256sum "$APK" | tee apps/app-conductor/android/app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload signed APK evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-conductor-signed-release
          # Excepción release: APK firmada se conserva 90 días, no contiene PII de tests
          retention-days: 90
          if-no-files-found: error
          path: |
            apps/app-conductor/android/app/build/outputs/apk/release/app-release.apk
            apps/app-conductor/android/app/build/outputs/apk/release/signature.txt
            apps/app-conductor/android/app/build/outputs/apk/release/SHA256SUMS.txt

  edge-functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Check Edge Functions
        run: deno task check:functions

      - name: Test Edge Functions
        run: deno task test:functions

  panel-admin-smoke:
    name: Panel admin smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_PUBLIC_APP_VERSION: 0.0.0-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_RUUM_AMBIENTE: staging
      NEXT_PUBLIC_RUUM_SOPORTE_TELEFONO: "5500000000"
      NEXT_PUBLIC_RUUM_SOPORTE_CORREO: soporte-conductores-pruebas@example.test
      NEXT_PUBLIC_RUUM_EMERGENCIA_TELEFONO: "911"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.51.1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: pnpm --filter @ruum/panel-admin exec playwright install --with-deps chromium

      - name: Run panel admin smoke
        run: pnpm --filter @ruum/panel-admin test:smoke

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panel-admin-smoke-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/panel-admin/playwright-report/
            apps/panel-admin/test-results/
            !**/.auth/**
            !**/*.zip

  panel-admin-load-test:
    name: Panel admin load test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://ci.supabase.test' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'ci-anon-key' }}
      NEXT_PUBLIC_PANEL_ADMIN_DEMO: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install k6
        env:
          K6_VERSION: v0.54.0
          K6_SHA256: c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589
        run: |
          set -euo pipefail
          curl -fsSL -o k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "${K6_SHA256}  k6.tar.gz" | sha256sum --check --status
          tar xzf k6.tar.gz
          sudo cp "k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Build panel-admin
        run: pnpm --filter @ruum/panel-admin build

      - name: Run k6 load test
        run: |
          mkdir -p tests/load/results
          k6 run tests/load/panel-admin-degradacion.js \
            --out json=tests/load/results/resultados.json \
            -e BASE_URL=http://127.0.0.1:3102 \
            2>&1 | tee tests/load/results/reporte.txt

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panel-admin-k6-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            tests/load/results/

  app-conductor-a11y:
    name: App conductor accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://ci.supabase.test' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'ci-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || 'ci-service-role' }}
      PLAYWRIGHT_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://ci.supabase.test' }}
      PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || 'ci-service-role' }}
      PLAYWRIGHT_E2E_CONDUCTOR_EMAIL: ${{ secrets.E2E_CONDUCTOR_EMAIL || 'test@example.test' }}
      PLAYWRIGHT_E2E_CONDUCTOR_PASSWORD: ${{ secrets.E2E_CONDUCTOR_PASSWORD || 'TestPass123!' }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_RUUM_AMBIENTE: staging
      CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_RUUM_SOPORTE_TELEFONO: "5500000000"
      NEXT_PUBLIC_RUUM_SOPORTE_CORREO: soporte-conductores-pruebas@example.test
      NEXT_PUBLIC_RUUM_EMERGENCIA_TELEFONO: "911"
      PLAYWRIGHT_DISABLE_AUTH_ARTIFACTS: "1"
      PLAYWRIGHT_A11Y_PROJECT: chromium

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.51.1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm --filter @ruum/app-conductor exec playwright install --with-deps chromium

      - name: Ensure dummy auth state for CI without real Supabase
        run: |
          mkdir -p apps/app-conductor/tests/.auth
          echo '{"cookies":[],"origins":[]}' > apps/app-conductor/tests/.auth/conductor.json

      - name: Build production app
        run: pnpm --filter @ruum/app-conductor build

      - name: Start production server
        run: |
          pnpm --filter @ruum/app-conductor exec next start -p 3001 > /tmp/ci-a11y-server.log 2>&1 &
          echo $! > /tmp/ci-a11y-server.pid
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost:3001/onboarding > /dev/null 2>&1; then
              echo "Server ready after $i attempts"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: CI accessibility server not responding"
              cat /tmp/ci-a11y-server.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run accessibility tests
        run: pnpm --filter @ruum/app-conductor test:a11y -- --project=chromium --workers=1

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/ci-a11y-server.pid ]; then kill $(cat /tmp/ci-a11y-server.pid) || true; fi

      - name: Build Storybook
        run: pnpm --filter @ruum/app-conductor storybook:build

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-conductor-accessibility
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/app-conductor/playwright-report/
            apps/app-conductor/results/axe-results.json
            apps/app-conductor/artifacts/a11y/
            apps/app-conductor/test-results/
            apps/app-conductor/storybook-static/
            !apps/app-conductor/tests/.auth/
            !apps/app-conductor/test-results/**/tests/.auth/
            !apps/app-conductor/test-results/**/*.json
            !apps/app-conductor/test-results/**/*.zip

  app-conductor-lighthouse:
    name: App conductor Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://ci.supabase.test' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'ci-anon-key' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_RUUM_AMBIENTE: staging
      CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_CSP_STRICT_STYLES: "true"
      NEXT_PUBLIC_RUUM_SOPORTE_TELEFONO: "5500000000"
      NEXT_PUBLIC_RUUM_SOPORTE_CORREO: soporte-conductores-pruebas@example.test
      NEXT_PUBLIC_RUUM_EMERGENCIA_TELEFONO: "911"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.51.1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Lighthouse Chromium
        run: pnpm --filter @ruum/app-conductor exec playwright install --with-deps chromium

      - name: Build production app
        run: pnpm --filter @ruum/app-conductor build

      - name: Start production server
        run: |
          pnpm --filter @ruum/app-conductor exec next start -p 3001 > /tmp/ci-lighthouse-server.log 2>&1 &
          echo $! > /tmp/ci-lighthouse-server.pid
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost:3001/onboarding > /dev/null 2>&1; then
              echo "Server ready after $i attempts"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: CI Lighthouse server not responding"
              cat /tmp/ci-lighthouse-server.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run Lighthouse public routes
        run: pnpm --filter @ruum/app-conductor test:lighthouse

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/ci-lighthouse-server.pid ]; then kill $(cat /tmp/ci-lighthouse-server.pid) || true; fi

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-conductor-lighthouse
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/app-conductor/.lighthouse-ci/*.html
            apps/app-conductor/.lighthouse-ci/*.json
            apps/app-conductor/.lighthouseci/

  app-conductor-android-config:
    name: Android Firebase and Gradle config
    if: false  # Desactivado: no se utiliza Firebase
    env:
      RUUM_REMOTE_URL: ${{ vars.RUUM_CONDUCTOR_REMOTE_URL_STAGING }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inject Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_B64" || (echo "Missing FIREBASE_GOOGLE_SERVICES_JSON_B64" && exit 1)
          echo "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > apps/app-conductor/android/app/google-services.json
      - name: Validate Firebase package and project
        run: node scripts/validate-firebase-config.mjs
      - name: Validate Gradle project
        working-directory: apps/app-conductor/android
        run: ./gradlew tasks --no-daemon

  sql-tests:
    name: SQL pgTAP regression tests (PR-06 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: v2.117.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset local database
        run: pnpm db:reset

      - name: Run all SQL tests (P1 PR-06 gate)
        run: pnpm test:sql

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

